<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Leo — Constellation &amp; Optical Mesh (Generic Overview)</title>
<meta name="description" content="A simple animated walkthrough of how Amazon Leo's low-orbit satellites form one network: three shells, ninety-eight planes, continuous coverage, and a mesh of laser crosslinks. Built from public FCC and Amazon information only; schematic and not to scale.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b2749'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e9f2ff' stroke-width='1.4'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5' fill='none' stroke='%237ce9ff' stroke-width='1.2' transform='rotate(-28 16 16)'/%3E%3Ccircle cx='27' cy='9' r='1.7' fill='%237ce9ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Cover stripped: this page is a self-contained, embeddable blueprint widget.
     Compliance lives ON the sheet (persistent chip, title-block general notes,
     PUBLIC DATA ONLY stamp). Content is 100% public FCC / Amazon record. -->

<!-- ============ PINNED STAGE ============ -->
<section class="stage" aria-label="Animated blueprint of the Amazon Leo constellation and its optical laser mesh">

<svg id="bp" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="var(--grid-minor)" stroke-width="0.5"/>
    </pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="var(--grid-major)" stroke-width="0.6"/>
    </pattern>
    <pattern id="hatch-b" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(124,233,255,0.30)" stroke-width="0.8"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 5 L10 1.4 L10 8.6 Z" fill="var(--ink-mid)" stroke="none"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 5 L10 1.4 L10 8.6 Z" fill="var(--signal)" stroke="none"/>
    </marker>
    <clipPath id="frame-clip"><rect x="56" y="56" width="1488" height="888"/></clipPath>
  </defs>

  <!-- ================= SHEET (never transforms) ================= -->
  <g id="sheet">
    <rect id="grid-1" x="56" y="56" width="1488" height="888" fill="url(#gmin)"/>
    <rect id="grid-2" x="56" y="56" width="1488" height="888" fill="url(#gmaj)"/>
    <rect id="frame-outer" class="ln-low dr" pathLength="1" x="24" y="24" width="1552" height="952"/>
    <rect id="frame-inner" class="ln-mid dr" pathLength="1" x="56" y="56" width="1488" height="888"/>
    <g id="zones"></g>

    <g id="titleblock">
      <rect class="ln-mid dr" pathLength="1" x="1156" y="856" width="388" height="88"/>
      <path class="ln-low dr" pathLength="1" d="M1156 884 H1544 M1156 914 H1544 M1306 884 V914 M1386 884 V914 M1246 914 V944 M1360 914 V944 M1440 914 V944"/>
      <text x="1162" y="867" font-size="5.8" class="t-low" letter-spacing="0.18em">TITLE</text>
      <text x="1162" y="879" font-size="8.4" class="t-hi t-500">AMAZON LEO — CONSTELLATION &amp; OPTICAL MESH</text>
      <text x="1162" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">DWG NO</text>
      <text x="1162" y="908" font-size="10" class="t-hi t-500">LEO-NET-CON-001</text>
      <text x="1312" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">SIZE</text>
      <text x="1312" y="908" font-size="10" class="t-hi t-500">E</text>
      <text x="1392" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">SCALE</text>
      <text x="1392" y="908" font-size="10" class="t-hi t-500">NTS</text>
      <text x="1162" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">REV</text>
      <text x="1162" y="938" font-size="10" class="t-hi t-500">P — PUBLIC</text>
      <text x="1252" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">SHEET</text>
      <text x="1252" y="938" font-size="10" class="t-hi t-500">1 OF 1</text>
      <text x="1366" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">UNITS</text>
      <text x="1366" y="938" font-size="10" class="t-hi t-500">km</text>
      <text x="1446" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">DATE</text>
      <text x="1446" y="938" font-size="10" class="t-hi t-500">2026-07</text>
    </g>

    <g id="notes">
      <text x="68" y="886" font-size="6" class="t-mid" letter-spacing="0.22em">GENERAL NOTES</text>
      <text x="68" y="900" font-size="7" class="t-low">1. CONSTELLATION &amp; OPTICAL-MESH OVERVIEW — REPRESENTATIVE.</text>
      <text x="68" y="912" font-size="7" class="t-low">2. COMPILED SOLELY FROM PUBLIC SOURCES (FCC / AMAZON), JUL 2026.</text>
      <text x="68" y="924" font-size="7" class="t-low">3. NOT DERIVED FROM INTERNAL OR EXPORT-CONTROLLED DATA.</text>
      <text x="68" y="936" font-size="7" class="t-low">4. ORBITAL GEOMETRY SCHEMATIC · NOT TO SCALE · NO REAL EPHEMERIS.</text>
    </g>

    <g id="stamp" transform="translate(408 512) rotate(-7)">
      <rect x="-128" y="-26" width="256" height="52" rx="3" class="ln-acc" stroke-width="1.6"/>
      <rect x="-122" y="-20" width="244" height="40" rx="2" class="ln-acc" stroke-width="0.5" opacity="0.55"/>
      <text x="0" y="-1" font-size="15" text-anchor="middle" class="t-acc t-500" letter-spacing="0.24em">PUBLIC DATA ONLY</text>
      <text x="0" y="13" font-size="6" text-anchor="middle" class="t-acc" letter-spacing="0.16em" opacity="0.75">FCC FILINGS &amp; PRESS · NO INTERNAL DATA</text>
    </g>
  </g>

  <!-- ================= WORLD (camera target) ================= -->
  <g id="world-clip" clip-path="url(#frame-clip)">
    <g id="world">

      <!-- generated far GEO reference ring (drawing.js) -->
      <g id="geo-ring"></g>

      <!-- ============ EARTH (wireframe globe) ============ -->
      <circle id="earth" class="ln-mid dr" pathLength="1" cx="560" cy="540" r="250" stroke-width="1.0"/>
      <g id="graticule"></g>

      <!-- generated orbit geometry (drawing.js) -->
      <g id="planes"></g>
      <g id="shells"></g>
      <g id="sats"></g>

      <!-- ============ SCENE 1 · LEO altitude bracket ============ -->
      <g id="lbl-leo">
        <path class="ln-acc dash-ext" stroke-width="0.6" d="M300 690 L300 636 L344 636"/>
        <text x="296" y="702" text-anchor="end" font-size="7" class="t-acc t-500" letter-spacing="0.12em">LEO SHELLS</text>
        <text x="296" y="712" text-anchor="end" font-size="5" class="t-low">590–630 km · ~20–40 ms</text>
      </g>

      <!-- ============ SCENE 2 · SHELL CALLOUTS (left side, clear of the panel) ============ -->
      <!-- leader labels on the shells themselves; the panel carries the full table -->
      <g id="shell-tab">
        <g>
          <circle cx="259" cy="400" r="2.8" class="ln-acc" stroke-width="0.8"/>
          <path class="ln-acc dash-ext" stroke-width="0.6" d="M259 400 L150 372 L120 372"/>
          <text x="116" y="368" text-anchor="end" font-size="7" class="t-acc t-500">630 km · 51.9°</text>
          <text x="116" y="378" text-anchor="end" font-size="5.4" class="t-low">784 satellites</text>
        </g>
        <g>
          <circle cx="251" cy="513" r="2.8" class="ln-mid" stroke-width="0.8"/>
          <path class="ln-dim dash-ext" d="M251 513 L150 500 L120 500"/>
          <text x="116" y="496" text-anchor="end" font-size="7" class="t-hi t-500">610 km · 42.0°</text>
          <text x="116" y="506" text-anchor="end" font-size="5.4" class="t-low">1,296 satellites</text>
        </g>
        <g>
          <circle cx="289" cy="638" r="2.8" class="ln-mid" stroke-width="0.8"/>
          <path class="ln-dim dash-ext" d="M289 638 L150 628 L120 628"/>
          <text x="116" y="624" text-anchor="end" font-size="7" class="t-hi t-500">590 km · 33.0°</text>
          <text x="116" y="634" text-anchor="end" font-size="5.4" class="t-low">1,156 satellites</text>
        </g>
        <text x="116" y="700" text-anchor="end" font-size="6" class="t-low t-500" letter-spacing="0.12em">TOTAL 3,236 · 98 PLANES · PUBLIC FCC</text>
      </g>

      <!-- ============ SCENE 3 · PLANES label ============ -->
      <g id="lbl-planes">
        <text x="232" y="180" font-size="24" class="t-acc t-500" letter-spacing="0.02em">98</text>
        <text x="286" y="172" font-size="8.4" class="t-hi t-500" letter-spacing="0.12em">ORBITAL</text>
        <text x="286" y="184" font-size="8.4" class="t-hi t-500" letter-spacing="0.12em">PLANES</text>
        <text x="232" y="200" font-size="5" class="t-low" letter-spacing="0.06em">each a ring of satellites; the rings fill the sky evenly</text>
        <path class="ln-dim dash-ext" stroke-width="0.6" d="M300 196 Q360 250 430 320"/>
      </g>

      <!-- generated coverage cone + footprints + hand-off (drawing.js) -->
      <g id="coverage"></g>
      <g id="lbl-cover">
        <text x="792" y="422" font-size="7" class="t-acc t-500" letter-spacing="0.12em">COVERAGE CELL</text>
        <text x="792" y="433" font-size="5" class="t-low">one satellite lights a small patch; cells overlap</text>
      </g>

      <!-- generated hero cluster + OISL mesh (drawing.js) -->
      <g id="cluster"></g>
      <g id="mesh"></g>
      <g id="mesh-note">
        <rect class="ln-laser" x="946" y="360" width="292" height="150" rx="3"/>
        <text x="966" y="384" font-size="7.4" class="t-laser t-500" letter-spacing="0.12em">OPTICAL INTER-SATELLITE LINKS</text>
        <text x="966" y="395" font-size="4.6" class="t-low" letter-spacing="0.08em">INFRARED LASER · ~1550 nm · A MESH IN ORBIT</text>
        <path class="ln-dim" d="M962 404 H1222"/>
        <text x="966" y="424" font-size="6.2" class="t-hi t-500">≤ 100 Gbps</text><text x="1074" y="424" font-size="5" class="t-low">per link</text>
        <text x="966" y="442" font-size="6.2" class="t-hi t-500">~1,000 km</text><text x="1074" y="442" font-size="5" class="t-low">demonstrated reach</text>
        <text x="966" y="460" font-size="6.2" class="t-laser t-500">~30% faster</text><text x="1082" y="460" font-size="5" class="t-low">than fibre over distance</text>
        <text x="966" y="484" font-size="5.2" class="t-hi t-500" letter-spacing="0.06em">DATA CROSSES THE SKY WITHOUT</text>
        <text x="966" y="494" font-size="5.2" class="t-hi t-500" letter-spacing="0.06em">TOUCHING THE GROUND.</text>
        <path class="ln-laser dash-ext" stroke-width="0.6" d="M946 420 L900 360"/>
      </g>

      <!-- generated sparse gateways (drawing.js) -->
      <g id="gateways"></g>
      <g id="ground-note">
        <text x="250" y="686" font-size="7.4" class="t-hi t-500" letter-spacing="0.12em">SPARSE GATEWAYS</text>
        <text x="250" y="700" font-size="5.2" class="t-low">the mesh routes traffic in orbit,</text>
        <text x="250" y="710" font-size="5.2" class="t-low">so few ground stations are needed —</text>
        <text x="250" y="720" font-size="5.2" class="t-low">a user far from any gateway is still served.</text>
      </g>

      <!-- ============ SCENE LEADERS (revealed per scene) ============ -->
      <g id="anno">
        <g id="lead-recap">
          <text x="110" y="150" font-size="8.4" class="t-hi t-500" letter-spacing="0.14em">ONE NETWORK IN ORBIT</text>
          <text x="110" y="163" font-size="5.2" class="t-low" letter-spacing="0.06em">3,236 satellites · 3 shells · 98 planes,</text>
          <text x="110" y="173" font-size="5.2" class="t-low" letter-spacing="0.06em">bound together by laser light.</text>
        </g>
      </g>

    </g>
  </g>
</svg>

  <div class="stage-vignette" aria-hidden="true"></div>
  <div class="panels"></div>
  <nav class="rail" aria-label="Blueprint sections"></nav>
  <div class="sr-scene" aria-live="polite"></div>
  <div class="dwg-chip mono" aria-hidden="true">PUBLIC SOURCES · FCC / AMAZON · NTS</div>
  <p class="stage-hint mono" aria-hidden="true">Scroll to animate · or click play</p>
  <p class="scene-hud mono" aria-hidden="true"><b class="scene-hud-num"></b><span class="scene-hud-title"></span></p>

  <!-- landing affordance: prominent play + scroll hint; fades on first interaction -->
  <div class="startcue" aria-hidden="true">
    <button class="startcue-play" type="button" aria-label="Play the walkthrough">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z"/></svg>
    </button>
    <p class="startcue-note">Press play — or scroll to explore</p>
  </div>
</section>

<script src="./vendor/gsap.min.js"></script>
<script src="./vendor/ScrollTrigger.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
