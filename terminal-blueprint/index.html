<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Leo Customer Terminal — Generic Systems Breakdown</title>
<meta name="description" content="A simple animated walkthrough of a generic Amazon Leo customer terminal — the flat antenna that connects a home or office to the satellite network. Built from public information only; illustrative and not to scale.">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Cover stripped: this page is a self-contained, embeddable blueprint widget.
     Compliance lives ON the sheet (persistent chip, title-block general notes,
     PUBLIC DATA ONLY stamp). -->

<!-- ============ PINNED STAGE ============ -->
<section class="stage" aria-label="Animated blueprint of a generic Amazon Leo customer terminal">

<svg id="bp" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="var(--grid-minor)" stroke-width="0.5"/>
    </pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="var(--grid-major)" stroke-width="0.6"/>
    </pattern>
    <pattern id="hatch-a" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(233,242,255,0.20)" stroke-width="0.8"/>
    </pattern>
    <pattern id="hatch-b" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(124,233,255,0.26)" stroke-width="0.8"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 5 L10 1.4 L10 8.6 Z" fill="var(--ink-mid)" stroke="none"/>
    </marker>
    <clipPath id="frame-clip"><rect x="56" y="56" width="1488" height="888"/></clipPath>
    <!-- indoor cutaway reveal: rect height grows 0 → 74 -->
    <clipPath id="clip-in"><rect id="clip-in-r" x="718" y="700" width="164" height="0"/></clipPath>
    <!-- LEO satellite glyph (inline styles: <use> shadow trees ignore doc CSS) -->
    <symbol id="sym-sat" overflow="visible">
      <rect x="0" y="0" width="22" height="13" style="fill:none;stroke:var(--ink-mid);stroke-width:0.9;stroke-linejoin:round"/>
      <rect x="-17" y="3.5" width="13" height="6" style="fill:none;stroke:var(--ink-dim);stroke-width:0.7;stroke-linejoin:round"/>
      <rect x="26" y="3.5" width="13" height="6" style="fill:none;stroke:var(--ink-dim);stroke-width:0.7;stroke-linejoin:round"/>
      <line x1="11" y1="13" x2="11" y2="17.5" style="stroke:var(--ink-dim);stroke-width:0.7;stroke-linecap:round"/>
    </symbol>
  </defs>

  <!-- ================= SHEET (never transforms) ================= -->
  <g id="sheet">
    <rect id="grid-1" x="56" y="56" width="1488" height="888" fill="url(#gmin)"/>
    <rect id="grid-2" x="56" y="56" width="1488" height="888" fill="url(#gmaj)"/>
    <rect id="frame-outer" class="ln-low dr" pathLength="1" x="24" y="24" width="1552" height="952"/>
    <rect id="frame-inner" class="ln-mid dr" pathLength="1" x="56" y="56" width="1488" height="888"/>
    <g id="zones"></g>

    <g id="titleblock">
      <rect class="ln-mid dr" pathLength="1" x="1156" y="856" width="388" height="88"/>
      <path class="ln-low dr" pathLength="1" d="M1156 884 H1544 M1156 914 H1544 M1306 884 V914 M1386 884 V914 M1246 914 V944 M1360 914 V944 M1440 914 V944"/>
      <text x="1162" y="867" font-size="5.8" class="t-low" letter-spacing="0.18em">TITLE</text>
      <text x="1162" y="879" font-size="8.4" class="t-hi t-500">AMAZON LEO CUSTOMER TERMINAL (UT) — GENERIC BREAKDOWN</text>
      <text x="1162" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">DWG NO</text>
      <text x="1162" y="908" font-size="10" class="t-hi t-500">LEO-UT-GEN-001</text>
      <text x="1312" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">SIZE</text>
      <text x="1312" y="908" font-size="10" class="t-hi t-500">E</text>
      <text x="1392" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">SCALE</text>
      <text x="1392" y="908" font-size="10" class="t-hi t-500">NTS</text>
      <text x="1162" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">REV</text>
      <text x="1162" y="938" font-size="10" class="t-hi t-500">P — PUBLIC</text>
      <text x="1252" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">SHEET</text>
      <text x="1252" y="938" font-size="10" class="t-hi t-500">1 OF 1</text>
      <text x="1366" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">UNITS</text>
      <text x="1366" y="938" font-size="10" class="t-hi t-500">—</text>
      <text x="1446" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">DATE</text>
      <text x="1446" y="938" font-size="10" class="t-hi t-500">2026-07</text>
    </g>

    <g id="notes">
      <text x="68" y="872" font-size="6" class="t-mid" letter-spacing="0.22em">GENERAL NOTES</text>
      <text x="68" y="886" font-size="7" class="t-low">1. GENERIC LEO CUSTOMER TERMINAL — REPRESENTATIVE ONLY.</text>
      <text x="68" y="898" font-size="7" class="t-low">2. COMPILED SOLELY FROM PUBLIC SOURCES, JUL 2026.</text>
      <text x="68" y="910" font-size="7" class="t-low">3. NOT DERIVED FROM INTERNAL OR EXPORT-CONTROLLED DATA.</text>
      <text x="68" y="922" font-size="7" class="t-low">4. NOT TO SCALE (NTS). NOT FOR ENGINEERING USE.</text>
      <text x="68" y="934" font-size="7" class="t-low">5. ANTENNA LATTICE ILLUSTRATIVE — NOT ACTUAL COUNT/GEOMETRY.</text>
    </g>

    <g id="stamp" transform="translate(1258 788) rotate(-7)">
      <rect x="-128" y="-26" width="256" height="52" rx="3" class="ln-acc" stroke-width="1.6"/>
      <rect x="-122" y="-20" width="244" height="40" rx="2" class="ln-acc" stroke-width="0.5" opacity="0.55"/>
      <text x="0" y="-1" font-size="15" text-anchor="middle" class="t-acc t-500" letter-spacing="0.26em">PUBLIC DATA ONLY</text>
      <text x="0" y="13" font-size="6" text-anchor="middle" class="t-acc" letter-spacing="0.2em" opacity="0.75">GENERIC REPRESENTATION · NO INTERNAL DATA</text>
    </g>
  </g>

  <!-- ================= WORLD (camera target) ================= -->
  <g id="world-clip" clip-path="url(#frame-clip)">
    <g id="world">

      <line id="centerline" class="ln-dim cl" x1="800" y1="100" x2="800" y2="840"/>

      <!-- LEO pass arc: over-the-top L→R needs sweep-flag 1 (sweep 0 renders below the
           chord). Circle about the array pivot 800,415 — carriers stay glued to it. -->
      <g id="orbit">
        <path class="ln-low dash-ext" d="M542 272 A 295 295 0 0 1 1058 272"/>
        <path class="ln-dim" d="M978 150 L989 158 L978 166"/>
        <text x="1000" y="242" font-size="6" class="t-low" letter-spacing="0.16em">SATELLITE PASSING OVERHEAD</text>
      </g>

      <!-- satellite carriers: each rotates about (800,415); glyph authored at zenith -->
      <g id="car-a"><use href="#sym-sat" transform="translate(789 113)"/></g>
      <g id="car-b"><use href="#sym-sat" transform="translate(789 113)"/></g>

      <!-- steered wavefront (rotates about the array pivot 800,415, in lock with the beam) -->
      <g id="wavefront">
        <path class="ln-acc" stroke-width="0.5" d="M744 366 H856"/>
        <path class="ln-acc" stroke-width="0.5" d="M748 381 H852"/>
        <path class="ln-acc" stroke-width="0.5" d="M752 396 H848"/>
      </g>

      <!-- user-link beam (rotates about the array pivot 800,415 — panel body never moves) -->
      <g id="beam">
        <path class="ln-acc" stroke-width="0.55" marker-end="url(#arr)" d="M796 405 V150"/>
        <path class="ln-acc" stroke-width="0.55" marker-end="url(#arr)" d="M804 150 V405"/>
        <text x="786" y="250" font-size="5.5" text-anchor="end" class="t-acc" letter-spacing="0.12em">SENDS</text>
        <text x="786" y="258" font-size="3.6" text-anchor="end" class="t-low" letter-spacing="0.12em">TO THE SATELLITE</text>
        <text x="814" y="250" font-size="5.5" class="t-acc" letter-spacing="0.12em">RECEIVES</text>
        <text x="814" y="258" font-size="3.6" class="t-low" letter-spacing="0.12em">FROM THE SATELLITE</text>
      </g>

      <!-- obstruction / rain cell (link scene furniture; lines generated) -->
      <g id="obstruction"><g id="obstruction-lines"></g></g>

      <!-- ============ THE TERMINAL ============ -->
      <g id="terminal">

        <!-- PANEL ASSEMBLY · flat phased array in elevation (thin layer stack-up) -->
        <g id="asm-panel">
          <!-- cover / radome skin -->
          <g id="cover">
            <path class="ln-low dr" pathLength="1" d="M700 405 Q800 397 900 405"/>
            <path class="ln-dim dash-ext" d="M700 405 V401 M900 405 V401"/>
          </g>
          <!-- phased-array board: element row (generated) sits on its top edge -->
          <g id="array-pcb">
            <rect class="ln-hi dr" pathLength="1" x="700" y="406" width="200" height="13"/>
            <g id="array-elements"></g>
          </g>
          <!-- Prometheus baseband board -->
          <g id="prom-board">
            <rect class="ln-mid dr" pathLength="1" x="716" y="421" width="168" height="11"/>
            <rect class="ln-acc dr" pathLength="1" x="784" y="423" width="32" height="7" stroke-width="1"/>
            <text x="800" y="429" text-anchor="middle" font-size="3.6" class="t-acc" letter-spacing="0.06em">PROMETHEUS</text>
          </g>
          <!-- thermal spreader plate -->
          <g id="thermal">
            <rect class="fill-hatch-a ln-mid dr" pathLength="1" x="710" y="434" width="180" height="7"/>
          </g>
          <!-- baseplate / chassis -->
          <g id="baseplate">
            <path class="ln-hi dr" pathLength="1" d="M700 443 H900 V450 H700 Z"/>
            <path class="ln-dim dr" pathLength="1" d="M724 450 V456 M776 450 V456 M824 450 V456 M876 450 V456"/>
          </g>
        </g>

        <!-- per-element phase strip (steer-scene diagram; bars generated) -->
        <g id="phase-strip">
          <text id="phase-caption" x="800" y="484" text-anchor="middle" font-size="4.6" class="t-low" letter-spacing="0.14em">STEERS THE BEAM · REPRESENTATIVE (NOT ACTUAL)</text>
        </g>

        <!-- array-face plan inset (looking down at the lattice; desktop detail) -->
        <g id="array-face">
          <rect class="ln-mid" x="916" y="330" width="86" height="86" rx="4"/>
          <circle class="ln-low dash-ext" cx="959" cy="373" r="37"/>
          <g id="face-dots"></g>
          <text x="959" y="326" text-anchor="middle" font-size="4.6" class="t-hi t-500" letter-spacing="0.12em">THE ANTENNA — FROM ABOVE</text>
          <text x="959" y="426" text-anchor="middle" font-size="4" class="t-low" letter-spacing="0.1em">REPRESENTATIVE LATTICE — NOT ACTUAL COUNT</text>
        </g>

        <!-- MOUNT · fixed (no tracking — the beam steers, not the panel) -->
        <g id="asm-mount">
          <path class="ln-mid dr" pathLength="1" d="M792 450 L788 596 M808 450 L812 596"/>
          <path class="ln-hi dr" pathLength="1" d="M776 596 H824"/>
          <path class="ln-low dr" pathLength="1" d="M784 596 L780 610 M816 596 L820 610"/>
          <rect class="ln-mid dr" pathLength="1" x="782" y="586" width="36" height="10" rx="2"/>
        </g>

        <!-- roofline / mounting surface + earthwork ticks (generated) -->
        <g id="roofline">
          <path class="ln-mid dr" pathLength="1" d="M600 600 H1000"/>
          <g id="roof-ticks"></g>
        </g>

        <!-- INDOOR UNIT · section view below the roofline (generic) -->
        <g id="asm-indoor">
          <text id="in-caption" x="800" y="676" text-anchor="middle" font-size="6" class="t-low" letter-spacing="0.18em">INSIDE THE INDOOR UNIT</text>
          <!-- single cable (data + power) from the panel down to the indoor unit -->
          <path id="in-cable" class="ln-mid dash-ext" d="M800 456 V690"/>
          <!-- router chassis -->
          <path id="in-shell" class="ln-hi dr" pathLength="1" d="M712 690 H888 V782 H712 Z"/>
          <!-- shelf under the unit -->
          <path class="ln-low dr" pathLength="1" d="M690 782 H910 M712 782 V796 M888 782 V796"/>
          <!-- port strip -->
          <rect class="ln-mid dr" pathLength="1" x="720" y="762" width="160" height="12"/>
          <path class="ln-dim dr" pathLength="1" d="M732 768 H748 M760 768 H776 M788 768 H804"/>
          <!-- ghost internals (hidden-line convention, pre-reveal) -->
          <g id="in-hid">
            <rect class="ln-dim dash-hid" x="726" y="712" width="148" height="60"/>
            <path class="ln-dim dash-hid" d="M736 726 H864 M736 738 H864"/>
          </g>
          <!-- cutaway pocket (hatched) + opening frame -->
          <g id="in-cut" clip-path="url(#clip-in)">
            <rect class="fill-hatch-a ln-low" x="718" y="700" width="164" height="74"/>
          </g>
          <rect id="in-frame" class="ln-mid" x="718" y="700" width="164" height="74"/>
          <!-- Wi-Fi to devices -->
          <g id="in-wifi">
            <path class="ln-low" d="M892 704 q16 -12 32 0 M892 712 q22 -18 44 0" stroke-width="0.5"/>
            <rect class="ln-mid" x="928" y="726" width="30" height="20" rx="1.5"/>
            <path class="ln-dim" d="M928 742 H958"/>
            <rect class="ln-mid" x="936" y="752" width="14" height="24" rx="2"/>
            <path class="ln-dim" d="M939 772 H947"/>
            <text x="943" y="722" text-anchor="middle" font-size="4" class="t-low" letter-spacing="0.12em">DEVICES</text>
          </g>
        </g>
        <!-- indoor unit internals (extractable; clipped by the same reveal; generated) -->
        <g id="in-clip-w" clip-path="url(#clip-in)">
          <g id="router-row"></g>
        </g>

        <!-- END-TO-END · single-line diagram strip -->
        <g id="asm-net">
          <text x="636" y="852" font-size="6" class="t-low" letter-spacing="0.18em">THE PATH — YOU TO THE CLOUD</text>
          <!-- TERMINAL node -->
          <rect class="ln-hi dr" pathLength="1" x="600" y="874" width="46" height="38" rx="3"/>
          <path class="ln-mid dr" pathLength="1" d="M610 894 H636"/>
          <path class="ln-acc dr" pathLength="1" d="M623 894 L631 884"/>
          <text x="623" y="924" text-anchor="middle" font-size="6" class="t-hi t-500" letter-spacing="0.12em">TERMINAL</text>
          <!-- link to SATELLITE -->
          <path class="ln-mid dr" pathLength="1" d="M646 892 H700"/>
          <text x="673" y="886" text-anchor="middle" font-size="3.6" class="t-low" letter-spacing="0.1em">RADIO LINK</text>
          <g transform="translate(700 884)"><use href="#sym-sat" transform="scale(0.7)"/></g>
          <text x="712" y="924" text-anchor="middle" font-size="6" class="t-hi t-500" letter-spacing="0.12em">SATELLITE</text>
          <!-- mesh to GATEWAY -->
          <path class="ln-mid dr" pathLength="1" d="M732 892 H788"/>
          <text x="760" y="886" text-anchor="middle" font-size="3.6" class="t-low" letter-spacing="0.1em">LASER LINKS</text>
          <rect class="ln-hi dr" pathLength="1" x="788" y="874" width="48" height="38" rx="3"/>
          <path class="ln-mid dr" pathLength="1" d="M797 902 Q812 886 826 894"/>
          <text x="812" y="924" text-anchor="middle" font-size="6" class="t-hi t-500" letter-spacing="0.12em">STATION</text>
          <!-- fiber to AWS / INTERNET -->
          <path class="ln-mid dr" pathLength="1" d="M836 892 H864 M864 892 L892 880 M864 892 L892 906"/>
          <text x="854" y="886" font-size="3.6" class="t-low" letter-spacing="0.1em">FIBER</text>
          <rect class="ln-hi dr" pathLength="1" x="892" y="864" width="76" height="28" rx="4"/>
          <text x="930" y="882" text-anchor="middle" font-size="5.5" class="t-acc" letter-spacing="0.14em">AWS CLOUD</text>
          <rect class="ln-hi dr" pathLength="1" x="892" y="906" width="76" height="26" rx="13"/>
          <text x="930" y="922" text-anchor="middle" font-size="5.5" class="t-hi" letter-spacing="0.14em">INTERNET</text>
          <!-- animated flow overlay (network scene) -->
          <path id="fiber-flow" class="ln-acc dash-hid" stroke-width="0.8" d="M646 892 H700 M732 892 H788 M836 892 H864 M864 892 L892 880 M864 892 L892 906"/>
          <text x="930" y="846" text-anchor="middle" font-size="4.4" class="t-low" letter-spacing="0.12em">&lt; 50 MS END TO END</text>
        </g>
      </g>

      <!-- DIMENSIONS · deliberately unvalued (REF): source data varies by model -->
      <g id="dims">
        <path class="ln-dim dash-ext" d="M700 464 V486 M900 464 V486"/>
        <path class="ln-mid dr" pathLength="1" d="M705 480 H895" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text x="800" y="474" text-anchor="middle" font-size="6.5" class="t-hi t-500" letter-spacing="0.12em">THE PANEL</text>
        <path class="ln-dim dash-ext" d="M906 406 H1092 M906 450 H1092"/>
        <path class="ln-mid dr" pathLength="1" d="M1086 411 V445" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text transform="translate(1100 428) rotate(-90)" text-anchor="middle" font-size="6" class="t-low" letter-spacing="0.16em">THIN — UNDER 1 INCH</text>
      </g>

      <!-- SCENE ANNOTATIONS (leader lines; revealed per scene) -->
      <g id="anno">
        <g id="lead-array">
          <circle cx="800" cy="411" r="1.4" fill="var(--signal)" stroke="none"/>
          <path pathLength="1" class="ln-acc" stroke-width="0.5" d="M800 411 L724 356 H694"/>
          <text x="691" y="354" font-size="5" text-anchor="end" class="t-hi t-500" letter-spacing="0.14em">HUNDREDS OF TINY ANTENNAS</text>
          <text x="691" y="361.5" font-size="3.4" text-anchor="end" class="t-low" letter-spacing="0.12em">ON ONE FLAT FACE · ILLUSTRATIVE</text>
          <circle cx="816" cy="426" r="1.2" fill="var(--signal)" stroke="none"/>
          <path pathLength="1" class="ln-acc" stroke-width="0.45" d="M816 426 L890 470 H914"/>
          <text x="917" y="468" font-size="4.5" class="t-hi t-500" letter-spacing="0.14em">SENDS + RECEIVES TOGETHER</text>
          <text x="917" y="475" font-size="3.2" class="t-low" letter-spacing="0.12em">ONE ANTENNA FOR BOTH</text>
        </g>
        <g id="lead-steer">
          <circle cx="800" cy="415" r="1.4" fill="var(--signal)" stroke="none"/>
          <path pathLength="1" class="ln-acc" stroke-width="0.5" d="M800 415 L720 452 H690"/>
          <text x="687" y="450" font-size="4.5" text-anchor="end" class="t-hi t-500" letter-spacing="0.14em">ELECTRONIC STEERING</text>
          <text x="687" y="457" font-size="3.2" text-anchor="end" class="t-low" letter-spacing="0.12em">SETS THE AIM</text>
          <circle cx="800" cy="380" r="1.4" fill="var(--signal)" stroke="none"/>
          <path pathLength="1" class="ln-acc" stroke-width="0.5" d="M800 380 L872 352 H902"/>
          <text x="905" y="350" font-size="4.5" class="t-hi t-500" letter-spacing="0.14em">THE SIGNAL TILTS</text>
          <text x="905" y="357" font-size="3.2" class="t-low" letter-spacing="0.12em">NO MOVING PARTS</text>
          <text id="ho-note" x="545" y="300" font-size="5" class="t-acc t-500" letter-spacing="0.16em">SWITCHES SATELLITES IN A BLINK</text>
        </g>
        <g id="lead-link">
          <circle cx="804" cy="300" r="1.4" fill="var(--signal)" stroke="none"/>
          <path pathLength="1" class="ln-acc" stroke-width="0.5" d="M804 300 L872 272 H904"/>
          <text x="907" y="270" font-size="5" class="t-hi t-500" letter-spacing="0.14em">ENCRYPTED</text>
          <text x="907" y="277.5" font-size="3.4" class="t-low" letter-spacing="0.12em">ALL THE WAY TO THE CLOUD</text>
          <circle cx="778" cy="320" r="1.4" fill="var(--signal)" stroke="none"/>
          <path pathLength="1" class="ln-acc" stroke-width="0.5" d="M778 320 L700 300 H672"/>
          <text x="669" y="298" font-size="4.5" text-anchor="end" class="t-hi t-500" letter-spacing="0.14em">RAIN OR BLOCKAGE</text>
          <text x="669" y="305" font-size="3.2" text-anchor="end" class="t-low" letter-spacing="0.12em">THE LINK ADAPTS</text>
        </g>
        <g id="lead-indoor">
          <circle cx="800" cy="426" r="1.2" fill="var(--signal)" stroke="none"/>
          <path pathLength="1" class="ln-acc" stroke-width="0.45" d="M800 573 L744 600 H716"/>
          <text x="713" y="598" font-size="4.5" text-anchor="end" class="t-hi t-500" letter-spacing="0.14em">ONE CABLE</text>
          <text x="713" y="605" font-size="3.2" text-anchor="end" class="t-low" letter-spacing="0.12em">DATA + POWER</text>
