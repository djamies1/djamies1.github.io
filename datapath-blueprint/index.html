<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Leo — End-to-End Data Path (Generic Overview)</title>
<meta name="description" content="A simple animated walkthrough of the journey your data takes on Amazon Leo: from a Ka-band terminal, up to a low-orbit satellite, across the optical laser mesh, down to a ground gateway, and into the nearest AWS Region. Built from public FCC and Amazon information only; schematic and not to scale.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b2749'/%3E%3Cpath d='M5 24 L14 9 L22 9 L27 20' fill='none' stroke='%237ce9ff' stroke-width='1.7'/%3E%3Ccircle cx='5' cy='24' r='2.1' fill='%23e9f2ff'/%3E%3Ccircle cx='27' cy='20' r='2.1' fill='%23e9f2ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Cover stripped: self-contained, embeddable blueprint widget. Compliance lives
     ON the sheet (persistent chip, title-block notes, PUBLIC DATA ONLY stamp).
     Content is 100% public FCC / Amazon record. -->

<!-- ============ PINNED STAGE ============ -->
<section class="stage" aria-label="Animated blueprint of the end-to-end Amazon Leo data path">

<svg id="bp" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="var(--grid-minor)" stroke-width="0.5"/>
    </pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="var(--grid-major)" stroke-width="0.6"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1.4 L10 5 L0 8.6 Z" fill="var(--ink-mid)" stroke="none"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 1.4 L10 5 L0 8.6 Z" fill="var(--signal)" stroke="none"/>
    </marker>
    <clipPath id="frame-clip"><rect x="56" y="56" width="1488" height="888"/></clipPath>
  </defs>

  <!-- ================= SHEET (never transforms) ================= -->
  <g id="sheet">
    <rect id="grid-1" x="56" y="56" width="1488" height="888" fill="url(#gmin)"/>
    <rect id="grid-2" x="56" y="56" width="1488" height="888" fill="url(#gmaj)"/>
    <rect id="frame-outer" class="ln-low dr" pathLength="1" x="24" y="24" width="1552" height="952"/>
    <rect id="frame-inner" class="ln-mid dr" pathLength="1" x="56" y="56" width="1488" height="888"/>
    <g id="zones"></g>

    <g id="titleblock">
      <rect class="ln-mid dr" pathLength="1" x="1156" y="856" width="388" height="88"/>
      <path class="ln-low dr" pathLength="1" d="M1156 884 H1544 M1156 914 H1544 M1306 884 V914 M1386 884 V914 M1246 914 V944 M1360 914 V944 M1440 914 V944"/>
      <text x="1162" y="867" font-size="5.8" class="t-low" letter-spacing="0.18em">TITLE</text>
      <text x="1162" y="879" font-size="8.4" class="t-hi t-500">AMAZON LEO — END-TO-END DATA PATH</text>
      <text x="1162" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">DWG NO</text>
      <text x="1162" y="908" font-size="10" class="t-hi t-500">LEO-NET-PATH-001</text>
      <text x="1312" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">SIZE</text>
      <text x="1312" y="908" font-size="10" class="t-hi t-500">E</text>
      <text x="1392" y="895" font-size="5.8" class="t-low" letter-spacing="0.18em">SCALE</text>
      <text x="1392" y="908" font-size="10" class="t-hi t-500">NTS</text>
      <text x="1162" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">REV</text>
      <text x="1162" y="938" font-size="10" class="t-hi t-500">P — PUBLIC</text>
      <text x="1252" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">SHEET</text>
      <text x="1252" y="938" font-size="10" class="t-hi t-500">1 OF 1</text>
      <text x="1366" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">FLOW</text>
      <text x="1366" y="938" font-size="10" class="t-hi t-500">L→R</text>
      <text x="1446" y="925" font-size="5.8" class="t-low" letter-spacing="0.18em">DATE</text>
      <text x="1446" y="938" font-size="10" class="t-hi t-500">2026-07</text>
    </g>

    <g id="notes">
      <text x="68" y="886" font-size="6" class="t-mid" letter-spacing="0.22em">GENERAL NOTES</text>
      <text x="68" y="900" font-size="7" class="t-low">1. END-TO-END DATA-PATH OVERVIEW — REPRESENTATIVE.</text>
      <text x="68" y="912" font-size="7" class="t-low">2. COMPILED SOLELY FROM PUBLIC SOURCES (FCC / AMAZON), JUL 2026.</text>
      <text x="68" y="924" font-size="7" class="t-low">3. NOT DERIVED FROM INTERNAL OR EXPORT-CONTROLLED DATA.</text>
      <text x="68" y="936" font-size="7" class="t-low">4. SIGNAL-FLOW SCHEMATIC · NTS · NO REAL GATEWAY / AWS LOCATION.</text>
    </g>

    <g id="stamp" transform="translate(470 500) rotate(-7)">
      <rect x="-128" y="-26" width="256" height="52" rx="3" class="ln-acc" stroke-width="1.6"/>
      <rect x="-122" y="-20" width="244" height="40" rx="2" class="ln-acc" stroke-width="0.5" opacity="0.55"/>
      <text x="0" y="-1" font-size="15" text-anchor="middle" class="t-acc t-500" letter-spacing="0.24em">PUBLIC DATA ONLY</text>
      <text x="0" y="13" font-size="6" text-anchor="middle" class="t-acc" letter-spacing="0.16em" opacity="0.75">FCC FILINGS &amp; PRESS · NO INTERNAL DATA</text>
    </g>
  </g>

  <!-- ================= WORLD (camera target) ================= -->
  <g id="world-clip" clip-path="url(#frame-clip)">
    <g id="world">

      <!-- ============ GROUND BASELINE ============ -->
      <g id="ground">
        <line class="ln-mid dr" pathLength="1" x1="130" y1="692" x2="1500" y2="692"/>
        <text x="140" y="706" font-size="5.6" class="t-low" letter-spacing="0.18em">EARTH · GROUND NETWORK</text>
        <text x="700" y="196" font-size="5.6" class="t-low" letter-spacing="0.2em">LOW EARTH ORBIT · ~590 km</text>
        <path class="ln-dim dash-ext" d="M150 214 H1120"/>
      </g>

      <!-- ============ 1 · TERMINAL ============ -->
      <g id="term-glyph">
        <path class="ln-mid dr" pathLength="1" d="M215 692 V672"/>
        <path class="ln-hi dr" pathLength="1" d="M197 674 L233 660 L241 670 L205 684 Z"/>
      </g>
      <g id="term-lbl">
        <text x="215" y="712" text-anchor="middle" font-size="6.2" class="t-hi t-500" letter-spacing="0.12em">LEO TERMINAL</text>
        <text x="215" y="722" text-anchor="middle" font-size="4.6" class="t-low" letter-spacing="0.08em">Ka FLAT PHASED ARRAY</text>
      </g>
      <g id="term-detail">
        <rect class="ln-low" x="112" y="486" width="264" height="132" rx="3"/>
        <text x="130" y="508" font-size="6.6" class="t-hi t-500" letter-spacing="0.12em">TERMINAL LINEUP</text>
        <text x="130" y="518" font-size="4.4" class="t-low" letter-spacing="0.08em">PUBLIC · CUSTOM AMAZON SILICON</text>
        <path class="ln-dim" d="M126 526 H362"/>
        <text x="130" y="544" font-size="6.4" class="t-hi t-500">Nano</text><text x="230" y="544" font-size="5.6" class="t-low">up to 100 Mbps</text>
        <text x="130" y="562" font-size="6.4" class="t-hi t-500">Pro</text><text x="230" y="562" font-size="5.6" class="t-low">up to 400 Mbps</text>
        <text x="130" y="580" font-size="6.4" class="t-acc t-500">Ultra</text><text x="230" y="580" font-size="5.6" class="t-low">up to 1 Gbps</text>
        <text x="130" y="602" font-size="4.8" class="t-low">uplink ~27.5–30 GHz · no dish to aim</text>
      </g>

      <!-- ============ 2 · UPLINK ============ -->
      <g id="uplink">
        <path class="ln-acc dr" pathLength="1" stroke-width="1.1" marker-end="url(#arr-acc)" d="M238 660 L410 288"/>
      </g>
      <g id="up-lbl">
        <text x="470" y="470" font-size="6.2" class="t-acc t-500" letter-spacing="0.1em">UPLINK ↑</text>
        <text x="470" y="481" font-size="5" class="t-low">Ka 27.5–30 GHz</text>
        <text x="470" y="497" font-size="4.6" class="t-low">low orbit → one-way ~10–20 ms</text>
      </g>

      <!-- ============ 3 · SATELLITES + LASER MESH ============ -->
      <g id="sats">
        <g><path class="ln-acc dr" pathLength="1" d="M432 251 L439 258 L432 265 L425 258 Z"/><path class="ln-low" d="M420 258 H425 M439 258 H444"/></g>
        <g><path class="ln-acc dr" pathLength="1" d="M648 219 L655 226 L648 233 L641 226 Z"/><path class="ln-low" d="M636 226 H641 M655 226 H660"/></g>
        <g><path class="ln-acc dr" pathLength="1" d="M868 251 L875 258 L868 265 L861 258 Z"/><path class="ln-low" d="M856 258 H861 M875 258 H880"/></g>
      </g>
      <g id="mesh-links">
        <path class="ln-laser dr" pathLength="1" stroke-width="1.1" d="M441 254 L640 229"/>
        <path class="ln-laser dr" pathLength="1" stroke-width="1.1" d="M656 229 L860 254"/>
      </g>
      <g id="mesh-lbl">
        <text x="648" y="205" text-anchor="middle" font-size="6" class="t-laser t-500" letter-spacing="0.1em">OPTICAL LASER MESH</text>
        <text x="648" y="304" text-anchor="middle" font-size="5" class="t-low">hop sat-to-sat at ~100 Gbps — no ground hop on the way</text>
      </g>

      <!-- ============ 4 · DOWNLINK ============ -->
      <g id="downlink">
        <path class="ln-acc dr" pathLength="1" stroke-width="1.1" marker-end="url(#arr-acc)" d="M888 288 L1050 660"/>
      </g>
      <g id="down-lbl">
        <text x="1006" y="470" font-size="6.2" class="t-acc t-500" letter-spacing="0.1em">DOWNLINK ↓</text>
        <text x="1006" y="481" font-size="5" class="t-low">Ka 17.7–20.2 GHz</text>
      </g>

      <!-- ============ 5 · GROUND GATEWAY ============ -->
      <g id="gw-glyph">
        <path class="ln-mid dr" pathLength="1" d="M1060 692 V670"/>
        <path class="ln-hi dr" pathLength="1" d="M1044 668 L1060 650 L1076 668"/>
        <path class="ln-low" d="M1050 660 Q1060 650 1070 660"/>
      </g>
      <g id="gw-lbl">
        <text x="1060" y="712" text-anchor="middle" font-size="6.2" class="t-hi t-500" letter-spacing="0.12em">GROUND GATEWAY</text>
        <text x="1060" y="722" text-anchor="middle" font-size="4.6" class="t-low" letter-spacing="0.08em">RADIO → FIBRE · FEW, WELL-SITED</text>
      </g>

      <!-- ============ 6 · FIBRE → AWS REGION → ENDPOINTS ============ -->
      <g id="fibre">
        <path class="ln-hi dr" pathLength="1" d="M1078 682 H1252"/>
        <path class="ln-hi dr" pathLength="1" d="M1078 687 H1252"/>
      </g>
      <g id="aws-glyph">
        <rect class="ln-acc dr" pathLength="1" x="1252" y="626" width="150" height="120" rx="4"/>
        <path class="ln-acc dr" pathLength="1" marker-end="url(#arr-acc)" d="M1402 654 H1444"/>
        <path class="ln-acc dr" pathLength="1" marker-end="url(#arr-acc)" d="M1402 686 H1444"/>
        <path class="ln-acc dr" pathLength="1" marker-end="url(#arr-acc)" d="M1402 718 H1444"/>
      </g>
      <g id="aws-lbl">
        <text x="1327" y="682" text-anchor="middle" font-size="6.6" class="t-hi t-500" letter-spacing="0.1em">NEAREST</text>
        <text x="1327" y="694" text-anchor="middle" font-size="6.6" class="t-hi t-500" letter-spacing="0.1em">AWS REGION</text>
        <text x="1327" y="708" text-anchor="middle" font-size="4.4" class="t-low" letter-spacing="0.06em">generic node · no real location</text>
        <text x="1162" y="676" text-anchor="middle" font-size="5" class="t-low" letter-spacing="0.12em">DEDICATED FIBRE</text>
        <text x="1450" y="656" font-size="5" class="t-acc t-500">CUSTOMER VPC</text>
        <text x="1450" y="688" font-size="5" class="t-acc t-500">PRIVATE NETWORK</text>
        <text x="1450" y="720" font-size="5" class="t-low">INTERNET / OTHER CLOUD</text>
      </g>

      <!-- ============ SCENE 7 · LATENCY BAR ============ -->
      <g id="lat-bar">
        <text x="220" y="792" font-size="6.4" class="t-hi t-500" letter-spacing="0.12em">END-TO-END LATENCY</text>
        <line class="ln-mid" x1="220" y1="812" x2="1330" y2="812"/>
        <rect class="ln-acc" x="220" y="806" width="150" height="12" rx="2"/>
        <text x="378" y="816" font-size="6" class="t-acc t-500">LEO ~20–40 ms round trip</text>
        <path class="ln-dim dash-ext" d="M220 830 H1330"/>
        <text x="220" y="844" font-size="5" class="t-low">a geostationary link (35,786 km) would be ~500–700 ms — roughly 15× longer.</text>
      </g>

      <!-- ============ SCENE LEADERS ============ -->
      <g id="anno">
        <g id="lead-recap">
          <text x="150" y="150" font-size="8.4" class="t-hi t-500" letter-spacing="0.12em">ONE ROUND TRIP</text>
          <text x="150" y="163" font-size="5.2" class="t-low" letter-spacing="0.05em">terminal → satellite → laser mesh → gateway → AWS,</text>
          <text x="150" y="173" font-size="5.2" class="t-low" letter-spacing="0.05em">and back — in tens of milliseconds.</text>
        </g>
      </g>

    </g>
  </g>
</svg>

  <div class="stage-vignette" aria-hidden="true"></div>
  <div class="panels"></div>
  <nav class="rail" aria-label="Blueprint sections"></nav>
  <div class="sr-scene" aria-live="polite"></div>
  <div class="dwg-chip mono" aria-hidden="true">PUBLIC SOURCES · FCC / AMAZON · NTS</div>
  <p class="stage-hint mono" aria-hidden="true">Scroll to animate · or click play</p>
  <p class="scene-hud mono" aria-hidden="true"><b class="scene-hud-num"></b><span class="scene-hud-title"></span></p>

  <div class="startcue" aria-hidden="true">
    <button class="startcue-play" type="button" aria-label="Play the walkthrough">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 L19 12 L8 19 Z"/></svg>
    </button>
    <p class="startcue-note">Press play — or scroll to explore</p>
  </div>
</section>

<script src="./vendor/gsap.min.js"></script>
<script src="./vendor/ScrollTrigger.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
