        drawGameWaiting('PORTAL KEEPER', 'destroy all targets \u2014 fire to start');
        return;
      }
      // targets
      for (const tgt of pkTargets) {
        ctx.save();
        ctx.strokeStyle = tgt.flash > 0 ? 'white' : `hsl(${tgt.hue},80%,60%)`;
        ctx.lineWidth = 2;
        if (tgt.flash > 0) { ctx.shadowBlur = 16; ctx.shadowColor = 'white'; }
        ctx.beginPath(); ctx.arc(tgt.x, tgt.y, tgt.r, 0, TWO_PI); ctx.stroke();
        if (tgt.hp > 1) { ctx.beginPath(); ctx.arc(tgt.x, tgt.y, tgt.r * 0.6, 0, TWO_PI); ctx.stroke(); }
        if (tgt.flash > 0) tgt.flash--;
        ctx.restore();
      }
      // palm zones
      for (const palm of palmCenters) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(palm.x, palm.y, PK_PALM_R, 0, TWO_PI); ctx.stroke();
        ctx.restore();
      }
      // ball trail + ball
      if (pkBall) {
        const b = pkBall;
        ctx.save();
        for (let i = 0; i < b.trail.length - 1; i++) {
          const a = (1 - i / b.trail.length) * 0.5;
          ctx.strokeStyle = `rgba(255,255,255,${a})`;
          ctx.lineWidth = PK_BALL_R * 1.2 * (1 - i / b.trail.length);
          ctx.beginPath();
          ctx.moveTo(b.trail[i].x, b.trail[i].y);
          ctx.lineTo(b.trail[i + 1].x, b.trail[i + 1].y);
          ctx.stroke();
        }
        ctx.restore();
        ctx.save();
        if (b.flash > 0) { ctx.shadowBlur = 16; ctx.shadowColor = 'white'; }
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(b.x, b.y, PK_BALL_R, 0, TWO_PI); ctx.fill();
        ctx.restore();
      }
      drawGameHUD(pkScore, pkLives, 'ROUND ' + pkRound);
      drawPopups(pkPopups);
      if (pkState === 'over') drawGameOverlay(pkScore);
    }
  });

  // ═══════════════════════════════════════════════════════════════════════════
  // MODE 7 — VOID EATER
  // ═══════════════════════════════════════════════════════════════════════════

  const VOID_MAX_R = 80, VOID_GROW_BASE = 0.12;
  let voidBlobs = [], voidScore = 0, voidLives = 3, voidState = 'waiting';
  let voidFrame = 0, voidNextSpawn = 120, voidSpawnInt = 120, voidPopups = [];

  function voidSpawnBlob() {
    const W = canvas.width, H = canvas.height;
    voidBlobs.push({
      x: 80 + rnd() * (W - 160),
      y: 80 + rnd() * (H - 160),
      size: 5,
      phase: rnd() * TWO_PI,
      growRate: VOID_GROW_BASE + voidFrame * 0.00006,
      touchFlash: 0
    });
  }

  MODES.push({
    name: 'VOID EATER',
    init() {
      voidBlobs = []; voidScore = 0; voidLives = 3; voidState = 'waiting';
      voidFrame = 0; voidNextSpawn = 120; voidSpawnInt = 120; voidPopups = [];
    },
    update() {
      if (voidState === 'waiting') {
        if (freshShockwave()) { voidState = 'playing'; voidSpawnBlob(); voidSpawnBlob(); }
        return;
      }
      if (voidState === 'over') {
        if (freshShockwave()) { this.init(); voidState = 'playing'; voidSpawnBlob(); voidSpawnBlob(); }
        return;
      }
      voidFrame++; voidNextSpawn--;
      if (voidNextSpawn <= 0) {
        voidSpawnBlob();
        voidSpawnInt = Math.max(55, 120 - Math.floor(voidFrame / 180) * 6);
        voidNextSpawn = voidSpawnInt;
      }

      for (let bi = voidBlobs.length - 1; bi >= 0; bi--) {
        const blob = voidBlobs[bi];
        blob.phase += 0.06;
        let touched = false;

        for (const palm of palmCenters) {
          const d = Math.hypot(blob.x - palm.x, blob.y - palm.y);
          if (d < blob.size + 55) { blob.size -= 0.45; touched = true; blob.touchFlash = 8; }
        }
        if (!touched) blob.size += blob.growRate;
        if (blob.touchFlash > 0) blob.touchFlash--;

        // shockwave destroy
        for (const sw of shockwaves) {
          const d = Math.hypot(blob.x - sw.cx, blob.y - sw.cy);
          if (d < sw.r + blob.size * 0.5) blob.size = -1;
        }

        if (blob.size <= 0) {
          voidScore += 30 + Math.floor(voidFrame / 60) * 5;
          voidPopups.push({ text: '+' + (30 + Math.floor(voidFrame / 60) * 5), x: blob.x, y: blob.y - 20, life: 40, sz: 18 });
          voidBlobs.splice(bi, 1);
        } else if (blob.size >= VOID_MAX_R) {
          voidLives--; voidBlobs.splice(bi, 1); voidSpawnBlob();
          if (voidLives <= 0) voidState = 'over';
        }
      }
      tickPopups(voidPopups);
    },
    draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (voidState === 'waiting') {
        drawGameWaiting('VOID EATER', 'contain the voids before they expand \u2014 fire to start');
        return;
      }

      for (const blob of voidBlobs) {
        // outer glow halo
        const g = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.size * 2);
        g.addColorStop(0, 'hsla(260,80%,30%,0.3)');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.fillRect(blob.x - blob.size * 2, blob.y - blob.size * 2, blob.size * 4, blob.size * 4);

        // jagged body
        ctx.save();
        const dangerFrac = blob.size / VOID_MAX_R;
        const hue = Math.round(260 + dangerFrac * 60);
        ctx.strokeStyle = `hsla(${hue},90%,65%,${0.6 + (blob.touchFlash / 8) * 0.4})`;
        ctx.fillStyle = `hsla(${hue},60%,8%,0.9)`;
        ctx.lineWidth = 1.8;
        if (blob.size > VOID_MAX_R * 0.7) { ctx.shadowBlur = 10; ctx.shadowColor = `hsl(${hue},100%,60%)`; }
        ctx.beginPath();
        for (let i = 0; i < 24; i++) {
          const a = (i / 24) * TWO_PI;
          const r = blob.size * (0.82 + 0.18 * Math.sin(a * 5 + blob.phase));
          const px = blob.x + Math.cos(a) * r, py = blob.y + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }

      // palm containment auras
      for (const palm of palmCenters) {
        const g = ctx.createRadialGradient(palm.x, palm.y, 0, palm.x, palm.y, 70);
        g.addColorStop(0, 'rgba(120,180,255,0.1)');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.fillRect(palm.x - 70, palm.y - 70, 140, 140);
      }

      drawGameHUD(voidScore, voidLives, voidBlobs.length + ' ACTIVE');
      drawPopups(voidPopups);
      if (voidState === 'over') drawGameOverlay(voidScore);
    }
  });

  // ─── Circular audio waveform ───────────────────────────────────────────────
  // A circular FFT waveform drawn around each palm.
  // Bins 0–63 mapped ascending (0°→180°), mirrored descending (180°→360°).
  // Also populates waveformProfiles[] for BEADS physics.

  function updateCircularWaveform() {
    waveformProfiles = [];
    if (!audioFreqData || palmCenters.length === 0) return;

    const totalEnergy = audioBass * 0.55 + audioMid * 0.30 + audioHigh * 0.15;
    if (totalEnergy < WAVE_MIN_ENERGY) return;

    // Fade-in alpha when energy is just above threshold
    const visAlpha = Math.min(1, (totalEnergy - WAVE_MIN_ENERGY) / 0.10);

    // Mode-matched hue — RIBBONS (null) animates slowly through full wheel
    const rawHue = MODE_OVERLAY_COLOR[currentMode];
    const hue    = rawHue !== null ? rawHue : (frameCount * 0.4) % 360;
    const lBase  = 62 + audioBass * 14;          // lightness pulses with bass

    // Hand openness controls ring scale: fist→small, open→large
    const effectiveBaseR  = WAVE_BASE_R  * (0.3 + waveOpenness * 0.95);
    const effectiveMaxAmp = WAVE_MAX_AMP * (0.45 + waveOpenness * 0.70);

    for (let palmIdx = 0; palmIdx < palmCenters.length; palmIdx++) {
      const pc = palmCenters[palmIdx];
      // ── Build radius sample array — mirrored spectrum for symmetry ──────
      const samples = _waveSamplesBufs[palmIdx];
      for (let i = 0; i < WAVE_SAMPLES; i++) {
        const half   = WAVE_SAMPLES / 2;
        const binIdx = i < half
          ? Math.floor((i / half) * WAVE_BINS)
          : Math.floor(((WAVE_SAMPLES - i) / half) * WAVE_BINS);
        // 3-bin weighted average to smooth spikes
        const b0 = audioFreqData[Math.max(0, binIdx - 1)] / 255;
        const b1 = audioFreqData[binIdx] / 255;
        const b2 = audioFreqData[Math.min(audioFreqData.length - 1, binIdx + 1)] / 255;
        samples[i] = effectiveBaseR + ((b0 + b1 * 2 + b2) / 4) * effectiveMaxAmp;
      }
      waveformProfiles.push({ cx: pc.x, cy: pc.y, samples });

      // ── Canvas point array — reuse pre-allocated objects ─────────────────
      const pts = _wavePtsBufs[palmIdx];
      for (let i = 0; i < WAVE_SAMPLES; i++) {
        const angle = (i / WAVE_SAMPLES) * TWO_PI - HALF_PI;
        pts[i].x = pc.x + samples[i] * Math.cos(angle);
        pts[i].y = pc.y + samples[i] * Math.sin(angle);
      }

      // Shared smooth-curve path builder
      function buildWavePath() {
        const mp = { x: (pts[0].x + pts[WAVE_SAMPLES - 1].x) / 2,
                     y: (pts[0].y + pts[WAVE_SAMPLES - 1].y) / 2 };
        ctx.beginPath();
        ctx.moveTo(mp.x, mp.y);
        for (let i = 0; i < WAVE_SAMPLES; i++) {
          const next = pts[(i + 1) % WAVE_SAMPLES];
          ctx.quadraticCurveTo(pts[i].x, pts[i].y,
            (pts[i].x + next.x) / 2, (pts[i].y + next.y) / 2);
        }
        ctx.closePath();
      }

      // ── 1. Interior radial fill — very faint, gives shape volume ────────
      ctx.save();
      const fillGrad = ctx.createRadialGradient(
        pc.x, pc.y, effectiveBaseR * 0.25,
        pc.x, pc.y, effectiveBaseR + effectiveMaxAmp
      );
      fillGrad.addColorStop(0,   `hsla(${hue},70%,${lBase}%,0)`);
      fillGrad.addColorStop(0.6, `hsla(${hue},80%,${lBase}%,${visAlpha * 0.04})`);
      fillGrad.addColorStop(1,   `hsla(${hue},90%,${lBase}%,0)`);
      buildWavePath();
      ctx.fillStyle = fillGrad;
      ctx.fill();
      ctx.restore();

      // ── 2. Dashed reference ring — shows resting radius ─────────────────
      ctx.save();
      ctx.strokeStyle = `hsla(${hue},60%,${lBase}%,${visAlpha * 0.18})`;
      ctx.lineWidth   = 1;
      ctx.setLineDash([6, 10]);
      ctx.lineDashOffset = -(frameCount * 0.6) % 16;  // slow clockwise rotation
      ctx.beginPath();
      ctx.arc(pc.x, pc.y, effectiveBaseR, 0, TWO_PI);
      ctx.stroke();
      ctx.restore();

      // ── 3. Atmospheric outer halo ────────────────────────────────────────
      ctx.save();
      ctx.shadowBlur  = 55;
      ctx.shadowColor = `hsla(${hue},100%,${lBase}%,${visAlpha * 0.35})`;
      ctx.strokeStyle = `hsla(${hue},85%,${lBase}%,${visAlpha * 0.20})`;
      ctx.lineWidth   = 9 + totalEnergy * 6;
      ctx.lineCap     = 'round';
      buildWavePath();
      ctx.stroke();
      ctx.restore();

      // ── 4. Medium glow pass ──────────────────────────────────────────────
      ctx.save();
      ctx.shadowBlur  = 18;
      ctx.shadowColor = `hsla(${hue},100%,${lBase + 10}%,${visAlpha * 0.55})`;
      ctx.strokeStyle = `hsla(${hue},90%,${lBase + 8}%,${visAlpha * 0.50})`;
      ctx.lineWidth   = 2.5 + totalEnergy * 2;
      ctx.lineCap     = 'round';
      buildWavePath();
      ctx.stroke();
      ctx.restore();

      // ── 5. Crisp inner line — bright, almost white ───────────────────────
      ctx.save();
      ctx.strokeStyle = `hsla(${hue},60%,${Math.min(lBase + 24, 94)}%,${visAlpha * 0.85})`;
      ctx.lineWidth   = 1;
      ctx.lineCap     = 'round';
      buildWavePath();
      ctx.stroke();
      ctx.restore();

      // ── 6. Peak highlight dots — top 5 amplitude peaks ──────────────────
      // Find local maxima in the sample array
      const peaks = [];
      for (let i = 0; i < WAVE_SAMPLES; i++) {
        const prev = samples[(i - 1 + WAVE_SAMPLES) % WAVE_SAMPLES];
        const curr = samples[i];
        const next = samples[(i + 1) % WAVE_SAMPLES];
        if (curr > prev && curr > next && curr > effectiveBaseR + effectiveMaxAmp * 0.45) {
          peaks.push({ i, amp: curr - effectiveBaseR });
        }
      }
      peaks.sort((a, b) => b.amp - a.amp);
      const topPeaks = peaks.slice(0, 5);
      for (const peak of topPeaks) {
        const angle = (peak.i / WAVE_SAMPLES) * TWO_PI - HALF_PI;
        const r     = samples[peak.i];
        const px    = pc.x + r * Math.cos(angle);
        const py    = pc.y + r * Math.sin(angle);
        const dotR  = 1.5 + (peak.amp / (effectiveMaxAmp || 1)) * 2.5;
        ctx.save();
        ctx.shadowBlur  = 10;
        ctx.shadowColor = `hsla(${hue},100%,90%,${visAlpha})`;
        ctx.fillStyle   = `hsla(${hue},40%,96%,${visAlpha * 0.9})`;
        ctx.beginPath();
        ctx.arc(px, py, dotR, 0, TWO_PI);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // ANIMATION LOOP
  // ═══════════════════════════════════════════════════════════════════════════

  // ─── Universal hand skeleton overlay ─────────────────────────────────────
  // Drawn on top of every mode so the user always sees their hands.

  function drawHandOverlay() {
    const useGhost = handSegPts.length === 0 && ghostFrames > 0 && ghostFrames < 8 && ghostSegs.length > 0;
    const segsArr  = useGhost ? ghostSegs    : handSegPts;
    const palmsArr = useGhost ? ghostPalms   : palmCenters;
    const ptsArr   = useGhost ? ghostHandPts : handPts;
    if (segsArr.length === 0) return;

    const baseOpacity = useGhost ? Math.max(0, 1 - ghostFrames/8) : 1;
    const rawHue = MODE_OVERLAY_COLOR[currentMode];
    const tintHue = rawHue === null ? (frameCount * 0.5) % 360 : rawHue;

    // Update trails (live hands only)
    if (!useGhost) {
      fingertipTrails.length = ptsArr.length;
      for (let hi = 0; hi < ptsArr.length; hi++) {
        const pts = ptsArr[hi];
        if (!pts || pts.length < 21) continue;
        if (!fingertipTrails[hi]) fingertipTrails[hi] = TIP_INDICES.map(() => ({ buf: new Float32Array(TRAIL_LENGTH * 2), head: 0, len: 0 }));
        for (let ti = 0; ti < TIP_INDICES.length; ti++) {
          const p = pts[TIP_INDICES[ti]];
          const tr = fingertipTrails[hi][ti];
          tr.buf[tr.head * 2]     = p.x;
          tr.buf[tr.head * 2 + 1] = p.y;
          tr.head = (tr.head + 1) % TRAIL_LENGTH;
          if (tr.len < TRAIL_LENGTH) tr.len++;
        }
      }
    } else {
      // Shrink trails while ghosting
      for (const handTrails of fingertipTrails) {
        if (!handTrails) continue;
        for (const trail of handTrails) { if (trail.len > 2) trail.len -= 2; }
      }
    }

    const glowPulse = 0.9 + 0.1 * Math.sin(frameCount * 0.04); // gentle breathing

    for (let hi = 0; hi < segsArr.length; hi++) {
      const segs = segsArr[hi];
      const pc   = palmsArr[hi];
      const pts  = ptsArr[hi];

      // 1. Tinted palm glow — breathing radius
      const glowR = 180 * glowPulse;
      const grad = ctx.createRadialGradient(pc.x, pc.y, 0, pc.x, pc.y, glowR);
      grad.addColorStop(0,   `hsla(${tintHue},80%,75%,${0.20 * baseOpacity})`);
      grad.addColorStop(0.4, `hsla(${tintHue},70%,60%,${0.08 * baseOpacity})`);
      grad.addColorStop(1,   `hsla(${tintHue},60%,50%,0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(pc.x - glowR, pc.y - glowR, glowR*2, glowR*2);

      // 2. Skeleton lines — per-finger hue
      ctx.save();
      ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let si = 0; si < segs.length; si++) {
        const seg = segs[si];
        const fHue = (tintHue + (SEG_HUE_OFFSET[si] || 0)) % 360;
        ctx.shadowBlur  = 12;
        ctx.shadowColor = `hsla(${fHue},100%,80%,${0.65 * baseOpacity})`;
        ctx.strokeStyle = `hsla(${fHue},65%,82%,${0.38 * baseOpacity})`;
        ctx.beginPath(); ctx.moveTo(seg.ax, seg.ay); ctx.lineTo(seg.bx, seg.by); ctx.stroke();
      }
      ctx.restore();

      // 3. Fingertip ink trails — with glow pre-pass and speed reactivity
      const handTrails = fingertipTrails[hi];
      const speed = handSpeeds[hi] || 0;
      const speedMult = speed > 8 ? 1 + speed * 0.04 : 1;
      const effectiveTrailLen = speed > 8 ? 18 : TRAIL_LENGTH;
      if (handTrails) {
        // 3a. Glow pre-pass — wider, softer trail beneath
        for (let ti = 0; ti < TIP_INDICES.length; ti++) {
          const trail = handTrails[ti];
          if (!trail || trail.len < 2) continue;
          ctx.save();
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.shadowBlur = 6;
          ctx.shadowColor = `hsla(${tintHue},100%,80%,0.3)`;
          const len = Math.min(trail.len, effectiveTrailLen);
          for (let i = 0; i < len - 1; i++) {
            const f  = 1 - i/len;
            const a  = f * 0.20 * baseOpacity * speedMult;
            const w  = 5 * f;
            // Read newest-first: index (len-1-i) is newest at i=0
            const bi  = ((trail.head + trail.len - 1 - i)     % trail.len) * 2;
            const bi1 = ((trail.head + trail.len - 1 - (i+1)) % trail.len) * 2;
            ctx.beginPath();
            ctx.moveTo(trail.buf[bi], trail.buf[bi + 1]);
            ctx.lineTo(trail.buf[bi1], trail.buf[bi1 + 1]);
            ctx.strokeStyle = `hsla(${tintHue},100%,80%,${a})`;
            ctx.lineWidth = w;
            ctx.stroke();
          }
          ctx.restore();
        }
        // 3b. Crisp trail
        for (let ti = 0; ti < TIP_INDICES.length; ti++) {
          const trail = handTrails[ti];
          if (!trail || trail.len < 2) continue;
          ctx.save();
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          const len = Math.min(trail.len, effectiveTrailLen);
          for (let i = 0; i < len - 1; i++) {
            const f  = 1 - i/len;
            const a  = f * 0.6 * baseOpacity * speedMult;
            const w  = Math.max(0.5, 3 * f);
            const bi  = ((trail.head + trail.len - 1 - i)     % trail.len) * 2;
            const bi1 = ((trail.head + trail.len - 1 - (i+1)) % trail.len) * 2;
            ctx.beginPath();
            ctx.moveTo(trail.buf[bi], trail.buf[bi + 1]);
            ctx.lineTo(trail.buf[bi1], trail.buf[bi1 + 1]);
            ctx.strokeStyle = `hsla(${tintHue},100%,80%,${a})`;
            ctx.lineWidth = w;
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // 4. All-joint dots — size varies by joint type + fingertip bloom
      if (pts && pts.length >= 21) {
        ctx.save();
        for (let li = 0; li < 21; li++) {
          const p = pts[li];
          const isTip     = TIP_INDICES.includes(li);
          const isKnuckle = [5,6,9,10,13,14,17,18].includes(li);
          const dotR  = isTip ? 5*glowPulse : isKnuckle ? 2.5 : 1.5;
          const dotOp = isTip ? 0.90 : isKnuckle ? 0.65 : 0.40;
          const lHue  = (tintHue + (SEG_HUE_OFFSET[li] || 0)) % 360;
          // Fingertip bloom — radial halo + shadowBlur
          if (isTip) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = `hsla(${lHue},80%,80%,${0.5 * baseOpacity})`;
            // Secondary halo behind tip
            const haloGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 14);
            haloGrad.addColorStop(0, `hsla(${lHue},60%,90%,${0.25 * baseOpacity})`);
            haloGrad.addColorStop(1, `hsla(${lHue},60%,90%,0)`);
            ctx.fillStyle = haloGrad;
            ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, TWO_PI); ctx.fill();
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, dotR, 0, TWO_PI);
          ctx.fillStyle = `hsla(${lHue},40%,95%,${dotOp * baseOpacity})`;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }
  }

  function drawClapPulses() {
    ctx.save();
    const rawHue = MODE_OVERLAY_COLOR[currentMode];
    const pulseHue = rawHue !== null ? rawHue : (frameCount * 0.5) % 360;
    const alive = [];
    for (const p of clapPulses) {
      p.r += 20; p.alpha -= 0.025;
      if (p.alpha <= 0 || p.r > p.maxR) continue;
      alive.push(p);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TWO_PI);
      ctx.strokeStyle = `hsla(${pulseHue},80%,85%,${p.alpha})`;
      ctx.lineWidth   = 3 * (1 - p.r/p.maxR) + 0.5;
      ctx.shadowBlur  = 18;
      ctx.shadowColor = `hsla(${pulseHue},100%,80%,${p.alpha * 0.5})`;
      ctx.stroke();
    }
    ctx.restore();
    clapPulses = alive;
  }

  // ─── Pinch detection ───────────────────────────────────────────────────────

  function isPinch(pts) {
    if (!pts || pts.length < 21) return false;
    const wrist = pts[0], knuckle = pts[9];
    const hx = knuckle.x - wrist.x, hy = knuckle.y - wrist.y;
    const handSize = Math.sqrt(hx*hx + hy*hy) || 1;
    const dx = pts[4].x - pts[8].x, dy = pts[4].y - pts[8].y;
    return Math.sqrt(dx*dx + dy*dy) / handSize < 0.18;
  }

  // Returns 0.0 (fist) → 1.0 (fully open), normalized to hand size
  function measureHandOpenness(pts) {
    if (!pts || pts.length < 21) return 0.5;
    const wrist = pts[0], knuckle = pts[9];
    const handSize = Math.sqrt((knuckle.x-wrist.x)**2 + (knuckle.y-wrist.y)**2) || 1;
    // Extension of 4 fingers: tip-to-MCP distance / handSize
    // tip indices: 8,12,16,20  MCP indices: 5,9,13,17
    const tipMcp = [[8,5],[12,9],[16,13],[20,17]];
    const ext = tipMcp.map(([tip, mcp]) => {
      const dx = pts[tip].x - pts[mcp].x, dy = pts[tip].y - pts[mcp].y;
      return Math.sqrt(dx*dx + dy*dy) / handSize;
    });
    return Math.min(1, (ext[0]+ext[1]+ext[2]+ext[3]) / 4 / 0.55);
  }

  function detectPinchGesture() {
    if (performance.now() < pinchCooldownUntil) return;
    // Require both hands visible and both pinching — prevents accidental triggers
    const anyPinch = handPts.length >= 2 && handPts.every(isPinch);
    if (anyPinch) {
      pinchFrameCount++;
      if (pinchFrameCount === PINCH_HOLD_FRAMES) {
        switchMode(currentMode + 1);
        showClapFeedback();
        pinchCooldownUntil = performance.now() + PINCH_COOLDOWN_MS;
      }
    } else {
      pinchFrameCount = 0;
    }
  }

  function drawShockwaveCharge() {
    if (!palmCenters.length) return;
    const rawHue = MODE_OVERLAY_COLOR[currentMode];
    const hue    = rawHue !== null ? rawHue : (frameCount * 0.5) % 360;
    ctx.save();
    for (let hi = 0; hi < palmCenters.length; hi++) {
      const slot    = palmCenters[hi].x > canvas.width / 2 ? 0 : 1;
      const frames  = perHandFistFrames[slot] || 0;
      if (frames < 1) continue;
      const pc       = palmCenters[hi];
      const progress = Math.min(1, frames / SHOCK_FIST_NEEDED);
      const charged  = frames >= SHOCK_FIST_NEEDED;

      if (charged) {
        // ── Charged: large radial bloom that breathes ──────────────────────
        const pulse  = 0.5 + 0.5 * Math.sin(frameCount * 0.28);
        const glowR  = 75 + pulse * 30;
        const bloom  = ctx.createRadialGradient(pc.x, pc.y, 0, pc.x, pc.y, glowR);
        bloom.addColorStop(0,   `hsla(${hue},100%,96%,${0.55 + pulse * 0.30})`);
        bloom.addColorStop(0.35,`hsla(${hue},100%,88%,${0.28 + pulse * 0.12})`);
        bloom.addColorStop(0.7, `hsla(${hue},90%,70%,${0.10 + pulse * 0.06})`);
        bloom.addColorStop(1,   `hsla(${hue},80%,55%,0)`);
        ctx.fillStyle = bloom;
        ctx.beginPath();
        ctx.arc(pc.x, pc.y, glowR, 0, TWO_PI);
        ctx.fill();
        // Outer crisp ring
        ctx.shadowBlur  = 20 + pulse * 15;
        ctx.shadowColor = `hsla(${hue},100%,90%,0.9)`;
        ctx.beginPath();
        ctx.arc(pc.x, pc.y, glowR * 0.88, 0, TWO_PI);
        ctx.strokeStyle = `hsla(${hue},90%,94%,${0.55 + pulse * 0.35})`;
        ctx.lineWidth   = 1.5;
        ctx.stroke();

      } else {
        // ── Charging: radial fill grows + arc sweep progress indicator ─────
        const outerR = 28 + progress * 42;
        const fill   = ctx.createRadialGradient(pc.x, pc.y, 0, pc.x, pc.y, outerR);
        fill.addColorStop(0,   `hsla(${hue},90%,90%,${progress * 0.40})`);
        fill.addColorStop(0.5, `hsla(${hue},85%,78%,${progress * 0.18})`);
        fill.addColorStop(1,   `hsla(${hue},80%,60%,0)`);
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.arc(pc.x, pc.y, outerR, 0, TWO_PI);
        ctx.fill();
        // Thin sweep arc as explicit progress indicator
        ctx.shadowBlur  = 8;
        ctx.shadowColor = `hsla(${hue},80%,75%,0.6)`;
        ctx.beginPath();
        ctx.arc(pc.x, pc.y, 28 + progress * 14,
                -HALF_PI, -HALF_PI + progress * TWO_PI);
        ctx.strokeStyle = `hsla(${hue},85%,82%,${0.35 + progress * 0.50})`;
        ctx.lineWidth   = 1.5;
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function updateDrawShockwaves() {
    if (!shockwaves.length) return;
    const rawHue = MODE_OVERLAY_COLOR[currentMode];
    const hue    = rawHue !== null ? rawHue : (frameCount * 0.5) % 360;
    ctx.save();
    let i = shockwaves.length;
    while (i--) {
      const sw  = shockwaves[i];
      sw.r     += sw.speed;
      sw.speed *= 0.975;           // gentle deceleration
      sw.alpha -= 0.011;
      if (sw.alpha <= 0 || sw.r > sw.maxR) { shockwaves.splice(i, 1); continue; }
      const frac = sw.r / sw.maxR;
      const rOp  = sw.alpha * (1 - frac * 0.6);

      // Snap flash — one-shot full-screen radial burst on spawn
      if (!sw.snapped) {
        sw.snapped = true;
        const flashR = Math.hypot(canvas.width, canvas.height) * 0.4;
        const flashGrad = ctx.createRadialGradient(sw.cx, sw.cy, 0, sw.cx, sw.cy, flashR);
        flashGrad.addColorStop(0, `hsla(${hue},100%,95%,0.08)`);
        flashGrad.addColorStop(1, `hsla(${hue},100%,95%,0)`);
        ctx.fillStyle = flashGrad;
        ctx.fillRect(sw.cx - flashR, sw.cy - flashR, flashR * 2, flashR * 2);
      }

      // Diffuse outer bloom ring — very faint wide pass
      ctx.beginPath(); ctx.arc(sw.cx, sw.cy, sw.r * 1.15, 0, TWO_PI);
      ctx.strokeStyle = `hsla(${hue},70%,70%,${rOp * 0.04})`;
      ctx.lineWidth   = Math.max(2, 40 * (1 - frac));
      ctx.shadowBlur  = 0;
      ctx.stroke();

      // Wide soft haze — tapers with distance
      ctx.beginPath(); ctx.arc(sw.cx, sw.cy, sw.r, 0, TWO_PI);
      ctx.strokeStyle = `hsla(${hue},80%,75%,${rOp * 0.12})`;
      ctx.lineWidth   = Math.max(2, 22 * (1 - frac));
      ctx.stroke();

      // Crisp bright ring with glow
      ctx.shadowBlur  = 22;
      ctx.shadowColor = `hsla(${hue},100%,88%,${rOp * 0.55})`;
      ctx.beginPath(); ctx.arc(sw.cx, sw.cy, sw.r, 0, TWO_PI);
      ctx.strokeStyle = `hsla(${hue},90%,90%,${rOp * 0.80})`;
      ctx.lineWidth   = 1.5;
      ctx.stroke();
      ctx.shadowBlur  = 0;
    }
    ctx.restore();
  }

  function animate(t) {
    requestAnimationFrame(animate);
    if (_audioTick) _audioTick();
    if (!MODES.length) return;
    const mode = MODES[currentMode];
    if (mode.update) mode.update(t);
    if (mode.draw)   mode.draw(t);
    // Smooth waveform scale based on hand openness + shockwave detection
    if (handPts.length > 0) {
      let sum = 0;
      for (let hi = 0; hi < handPts.length; hi++) {
        const raw  = measureHandOpenness(handPts[hi]);
        // Slot by screen position — right half = slot 0 (user's right hand in mirrored view)
        const slot = palmCenters[hi].x > canvas.width / 2 ? 0 : 1;
        if (raw < SHOCK_FIST_THRESH) {
          perHandFistFrames[slot] = (perHandFistFrames[slot] || 0) + 1;
        } else if (raw > SHOCK_OPEN_THRESH
                   && (perHandFistFrames[slot] || 0) >= SHOCK_FIST_NEEDED
                   && performance.now() > (shockCooldownUntil[slot] || 0)) {
          const pc = palmCenters[hi];
          shockwaves.push({
            cx: pc.x, cy: pc.y, r: 0,
            maxR: Math.hypot(canvas.width, canvas.height) * 0.65,
            speed: 18, alpha: 1.0, snapped: false,
          });
          shockCooldownUntil[slot]  = performance.now() + SHOCK_COOLDOWN_MS;
          perHandFistFrames[slot]   = 0;
        } else if (raw > SHOCK_OPEN_THRESH) {
          perHandFistFrames[slot] = 0;
        }
        perHandOpennessCurr[hi] = raw;
        sum += raw;
      }
      perHandOpennessCurr.length = handPts.length;
      // perHandFistFrames keyed by slot [0]=left half, [1]=right half — not truncated
      waveOpenness += (sum / handPts.length - waveOpenness) * 0.14;
    } else {
      waveOpenness += (0.7 - waveOpenness) * 0.04;  // drift to default when no hands
      perHandOpennessCurr.length = 0;
      // Don't instantly clear fist frames — MediaPipe can drop a frame mid-gesture.
      // Decay them instead so brief tracking loss doesn't abort a nearly-charged fist.
      for (let s = 0; s < perHandFistFrames.length; s++) {
        if (perHandFistFrames[s] > 0) perHandFistFrames[s] = Math.max(0, perHandFistFrames[s] - 3);
      }
    }
    updateCircularWaveform();
    drawHandOverlay();
    drawShockwaveCharge();
    if (shockwaves.length > 0) updateDrawShockwaves();
    detectPinchGesture();

    // Dissolve old frame out on top
    if (transitionAlpha > 0) {
      transitionAlpha = Math.max(0, transitionAlpha - 0.0278); // ~600ms at 60fps
      ctx.globalAlpha = easeOutQuad(transitionAlpha);
      ctx.drawImage(transitionCanvas, 0, 0);
      ctx.globalAlpha = 1;
    }

    if (clapPulses.length > 0) drawClapPulses();

    prevPalmCenters = palmCenters.map(p => ({x:p.x, y:p.y}));
    frameCount++;
  }

  // Initialise mode 0 and start loop
  MODES[0].init();
  statusModeEl.textContent = MODES[0].name;
  requestAnimationFrame(animate);

  // ═══════════════════════════════════════════════════════════════════════════
  // MEDIAPIPE HANDS
  // ═══════════════════════════════════════════════════════════════════════════

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
  });

  hands.setOptions({
    maxNumHands: 2, modelComplexity: 1,
    minDetectionConfidence: 0.5,  // was 0.7 — catches hands in more angles/lighting
    minTrackingConfidence:  0.4,  // was 0.5 — holds tracking through fast movement
  });

  hands.onResults((results) => {
    rawLandmarks    = results.multiHandLandmarks || [];
    handSegPts      = [];
    handPts         = [];
    palmCenters     = [];
    handednessLabels = [];

    for (let hi = 0; hi < rawLandmarks.length; hi++) {
      const landmarks = rawLandmarks[hi];
      let cx = 0, cy = 0;
      for (const lm of landmarks) { cx += lm.x; cy += lm.y; }
      cx /= landmarks.length; cy /= landmarks.length;

      const s = HAND_SCALE;
      // Raw scaled positions
      const rawP = landmarks.map(lm => ({
        x: (1-(cx+(lm.x-cx)*s)) * canvas.width,
        y:    (cy+(lm.y-cy)*s)  * canvas.height,
      }));

      // Compute per-hand speed (avg landmark delta in px/frame)
      let speed = 0;
      if (prevRawPts[hi]) {
        let totalDelta = 0;
        for (let j = 0; j < rawP.length; j++) {
          const dx = rawP[j].x - prevRawPts[hi][j].x;
          const dy = rawP[j].y - prevRawPts[hi][j].y;
          totalDelta += Math.sqrt(dx * dx + dy * dy);
        }
        speed = totalDelta / rawP.length;
      }
      handSpeeds[hi] = speed;
      prevRawPts[hi] = rawP.map(p => ({...p}));

      // Velocity-adaptive alpha: slow→0.25 (heavy smooth), fast→0.85 (near-raw)
      const alpha = 0.25 + Math.min(1, Math.max(0, speed / 20)) * 0.60;

      // Exponential smoothing
      if (smoothPts[hi]) {
        rawP.forEach((rp, j) => {
          smoothPts[hi][j].x = smoothPts[hi][j].x * (1 - alpha) + rp.x * alpha;
          smoothPts[hi][j].y = smoothPts[hi][j].y * (1 - alpha) + rp.y * alpha;
        });
        // Predictive offset for fast hands — compensates smoothing lag
        if (speed > 5 && prevRawPts[hi]) {
          for (let j = 0; j < smoothPts[hi].length; j++) {
            const vx = rawP[j].x - (prevRawPts[hi][j]?.x ?? rawP[j].x);
            const vy = rawP[j].y - (prevRawPts[hi][j]?.y ?? rawP[j].y);
            smoothPts[hi][j].x += vx * 0.3;
            smoothPts[hi][j].y += vy * 0.3;
          }
        }
      } else {
        smoothPts[hi] = rawP.map(p => ({...p}));
      }
      const pts = smoothPts[hi];

      handPts.push(pts);
      handSegPts.push(SEGMENTS.map(([a,b]) => ({ax:pts[a].x,ay:pts[a].y,bx:pts[b].x,by:pts[b].y})));
      palmCenters.push({x:pts[9].x, y:pts[9].y});
      const hn = results.multiHandedness || [];
      handednessLabels.push(hn[hi]?.label || 'Right');
    }

    // Trim arrays if fewer hands detected this frame
    smoothPts.length = rawLandmarks.length;
    prevRawPts.length = rawLandmarks.length;
    handSpeeds.length = rawLandmarks.length;

    if (rawLandmarks.length > 0) {
      // Update ghost data and reset ghost counter
      ghostSegs    = handSegPts.map(s => s.slice());
      ghostPalms   = palmCenters.map(p => ({...p}));
      ghostHandPts = handPts.map(h => h.map(p => ({...p})));
      ghostFrames  = 0;
      fingertipTrails.length = rawLandmarks.length;

      statusEl.textContent = `${rawLandmarks.length} hand${rawLandmarks.length>1?'s':''}`;
      if (!handsVisible) {
        handsVisible = true;
        introEl.classList.add('fade');
        setTimeout(() => introEl.style.display = 'none', 2000);
      }
    } else {
      ghostFrames++;
      statusEl.textContent = 'no hands';
    }
  });

  // ═══════════════════════════════════════════════════════════════════════════
  // CAMERA
  // ═══════════════════════════════════════════════════════════════════════════

  statusEl.textContent = 'requesting camera...';

  // ─── FaceMesh setup ────────────────────────────────────────────────────────

  const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
  });
  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5,
  });
  faceMesh.onResults((results) => {
    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const lms = results.multiFaceLandmarks[0];
      const rawFace = [];
      for (const idx of FACE_ATTRACTOR_INDICES) {
        const lm = lms[idx];
        if (lm) rawFace.push({ x: (1 - lm.x) * canvas.width, y: lm.y * canvas.height });
      }
      // Exponential smooth (α=0.45 — faces move slower than hands)
      if (smoothFacePts.length === rawFace.length) {
        for (let i = 0; i < rawFace.length; i++) {
          smoothFacePts[i].x = smoothFacePts[i].x * 0.55 + rawFace[i].x * 0.45;
          smoothFacePts[i].y = smoothFacePts[i].y * 0.55 + rawFace[i].y * 0.45;
        }
      } else {
        smoothFacePts = rawFace.map(p => ({...p}));
      }
      facePts = smoothFacePts.map(p => ({...p}));
      lastFacePts = facePts.map(p => ({...p}));
      faceGhostFrames = 0;
    } else {
      // Ghost persistence: hold last known face for 15 frames
      faceGhostFrames++;
      if (faceGhostFrames < 15 && lastFacePts.length > 0) {
        facePts = lastFacePts;
      } else {
        facePts = [];
        smoothFacePts = [];
      }
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
      await faceMesh.send({ image: video });
    },
    width: 640, height: 480,
  });

  camera.start()
    .then(() => { statusEl.textContent = 'show your hands'; initAudioAnalyser(); })
    .catch((err) => { statusEl.textContent = `camera: ${err.message}`; });

  // ═══════════════════════════════════════════════════════════════════════════
  // KEYBOARD
  // ═══════════════════════════════════════════════════════════════════════════

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'f': case 'F':
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
        break;
      case 'h': case 'H':
        video.classList.toggle('hidden');
        break;
      case 'm': case 'M':
        switchMode(currentMode+1);
        break;
      case 'c': case 'C':
        switchMode(currentMode+1);
        showClapFeedback();
        break;
      default:
        if (e.key >= '1' && e.key <= '4') switchMode(parseInt(e.key,10)-1);
    }
  });
  </script>
</body>
</html>
