<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Zone Finder — What to Grow in Your Garden</title>

  <!-- SEO -->
  <meta name="description" content="Find your USDA hardiness zone and discover exactly what to plant each month. Free interactive planting calendar for home gardeners across the US.">
  <meta property="og:title" content="Plant Zone Finder">
  <meta property="og:description" content="Find your zone and discover what to grow this month — free interactive planting calendar.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4ade80">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlantZone">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <link rel="stylesheet" href="lib/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="top-bar">
    <div id="title">
      <span class="leaf">🌱</span>
      <span>Plant Zone Finder</span>
    </div>
    <div id="search-bar">
      <input
        id="address-input"
        type="text"
        placeholder="Enter address or city..."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="locate-btn" aria-label="Use my location" title="Find my zone automatically">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
      </button>
      <button id="search-btn">Go</button>
    </div>
  </header>

  <div id="slider-bar">
    <div id="month-slider-wrap">
      <div id="season-banner">
        <div class="s-band s-winter"><span>❄️ Winter</span></div>
        <div class="s-band s-spring"><span>🌸 Spring</span></div>
        <div class="s-band s-summer"><span>☀️ Summer</span></div>
        <div class="s-band s-autumn"><span>🍂 Autumn</span></div>
        <div class="s-band s-winter s-dec"><span>❄️</span></div>
      </div>
      <input type="range" id="month-slider" min="1" max="12" step="1">
      <div id="month-labels">
        <span data-month="1">Jan</span>
        <span data-month="2">Feb</span>
        <span data-month="3">Mar</span>
        <span data-month="4">Apr</span>
        <span data-month="5">May</span>
        <span data-month="6">Jun</span>
        <span data-month="7">Jul</span>
        <span data-month="8">Aug</span>
        <span data-month="9">Sep</span>
        <span data-month="10">Oct</span>
        <span data-month="11">Nov</span>
        <span data-month="12">Dec</span>
      </div>
    </div>
  </div>

  <div id="season-bg"></div>
  <main id="globe-container">
    <div id="zone-legend">
      <div class="legend-title">Zones</div>
      <div id="legend-swatches"></div>
      <div class="legend-ends"><span>Coldest</span><span>Warmest</span></div>
    </div>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p id="loading-text">Loading zone data…</p>
    </div>
  </main>

  <aside id="info-panel" class="panel-hidden">
    <button id="panel-close">&times;</button>
    <div id="panel-content">
      <div id="zone-header">
        <span id="zone-badge">--</span>
        <div id="zone-meta">
          <p id="zone-name"></p>
          <p id="zone-temp"></p>
        </div>
      </div>
      <div id="frost-dates"></div>
      <div id="month-display"></div>
      <div id="month-context"></div>
      <div class="plant-section" id="section-startIndoors">
        <h3>Start Indoors</h3>
        <ul id="list-startIndoors"></ul>
      </div>
      <div class="plant-section" id="section-directSow">
        <h3>Direct Sow</h3>
        <ul id="list-directSow"></ul>
      </div>
      <div class="plant-section" id="section-transplant">
        <h3>Transplant Out</h3>
        <ul id="list-transplant"></ul>
      </div>
      <div class="plant-section" id="section-harvest">
        <h3>Harvest</h3>
        <ul id="list-harvest"></ul>
      </div>
      <p id="no-tasks">Nothing to plant this month — a good time to plan ahead.</p>
      <div id="garden-tip"></div>
    </div>
  </aside>

  <dialog id="crop-modal" aria-labelledby="modal-crop-name" aria-modal="true">
    <div id="modal-inner">
      <header id="modal-header">
        <div id="modal-title-row">
          <span id="modal-emoji" aria-hidden="true"></span>
          <h2 id="modal-crop-name"></h2>
          <span id="modal-difficulty" class="difficulty-badge"></span>
        </div>
        <button id="modal-close" aria-label="Close">&times;</button>
      </header>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <!-- CDN Libraries -->
  <script src="lib/leaflet.min.js"></script>
  <script src="lib/turf.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
